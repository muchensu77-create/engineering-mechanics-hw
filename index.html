<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>工程力学作业讲解</title>
<meta name="description" content="工程力学四章 21 道作业题的分步动画讲解：平面汇交力系、平面力偶系、平面任意力系、点的运动">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{
  --bg:#f4f2eb; --card:#fffdf7; --ink:#23221e; --ink2:#4b4840; --muted:#857f72; --rule:#dcd6c8; --soft:#ece8dd;
  --known:#c1432a; --unk:#2b5f88; --res:#2f7a4c; --geo:#9b9486; --hl:#a8730c; --axis:#6d685e;
  --sans:"Noto Sans SC","Source Han Sans SC","PingFang SC","Hiragino Sans GB","DengXian",sans-serif;
  --serif:"Noto Serif SC","Source Han Serif SC","Songti SC","SimSun",serif;
  --math:"Times New Roman","STIX Two Text","Noto Serif SC","Songti SC",serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1a1916; --card:#23221e; --ink:#ece8de; --ink2:#c8c3b6; --muted:#8f897c; --rule:#3b3933; --soft:#2c2b26;
    --known:#f07a5a; --unk:#74a9d8; --res:#5fc28c; --geo:#7f7a6e; --hl:#e0ad48; --axis:#a8a294;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1a1916; --card:#23221e; --ink:#ece8de; --ink2:#c8c3b6; --muted:#8f897c; --rule:#3b3933; --soft:#2c2b26;
  --known:#f07a5a; --unk:#74a9d8; --res:#5fc28c; --geo:#7f7a6e; --hl:#e0ad48; --axis:#a8a294;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:15.5px/1.8 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit}

/* 顶栏 */
.top{display:flex;align-items:center;gap:18px;padding:14px 28px;border-bottom:1px solid var(--rule);background:var(--bg)}
.top h1{font:700 19px/1.3 var(--serif);margin:0;letter-spacing:.03em}
.top .sub{color:var(--muted);font-size:13px;flex:1}
.top .theme{background:none;border:1px solid var(--rule);padding:3px 10px;font-size:12.5px;cursor:pointer;color:var(--ink2)}

.shell{display:grid;grid-template-columns:232px minmax(0,1fr)}
.side{border-right:1px solid var(--rule);padding:10px 0 40px;position:sticky;top:0;height:100vh;overflow:auto}
.side h4{font:600 12px var(--sans);color:var(--muted);letter-spacing:.1em;margin:18px 22px 4px}
.side a{display:flex;gap:8px;align-items:baseline;padding:6px 18px 6px 19px;color:var(--ink2);text-decoration:none;font-size:14px;border-left:3px solid transparent;line-height:1.5}
.side a .no{font:600 13.5px var(--math);color:var(--muted);min-width:22px}
.side a.chl .t{color:var(--muted);font-size:13px}
.side a.chl .no{font-family:var(--sans);font-size:12.5px}
.side a:hover{background:var(--soft)}
.side a.on{background:var(--soft);border-left-color:var(--known);color:var(--ink)}
.side a.on .no{color:var(--known)}
main{padding:30px 44px 90px;max-width:1320px;min-width:0}

/* 题目头 */
.tag{font-size:12.5px;color:var(--muted);letter-spacing:.06em}
.ph h2{font:700 27px/1.35 var(--serif);margin:4px 0 14px}
.orig{border-left:3px solid var(--rule);padding:2px 0 2px 14px;color:var(--ink2);font-size:14.5px;margin:0 0 12px;max-width:900px}
.orig .chg{color:var(--known);font-weight:600}
.given{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;font-size:14.5px;max-width:900px}
.given b{font-weight:600;color:var(--muted);font-size:12.5px;letter-spacing:.08em;padding-top:2px}

.know{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin:22px 0 28px}
.kc{background:var(--card);border:1px solid var(--rule);border-top:3px solid var(--hl);padding:11px 16px 12px}
.kc h5{margin:0 0 3px;font:600 14.5px var(--sans)}
.kc p{margin:0;font-size:14px;color:var(--ink2);line-height:1.75}

/* 图 + 步骤 */
.stage{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,1fr);gap:28px;align-items:start}
.fig{position:sticky;top:14px;background:var(--card);border:1px solid var(--rule)}
.fig svg.dg{display:block;width:100%;height:auto;touch-action:manipulation}
.vtabs{display:flex;border-bottom:1px solid var(--rule)}
.vtabs button{flex:1;padding:8px 6px;border:none;background:none;border-bottom:2px solid transparent;cursor:pointer;color:var(--muted);font-size:14px}
.vtabs button.on{color:var(--ink);border-bottom-color:var(--known);font-weight:600}
.figbar{display:flex;align-items:center;gap:8px;border-top:1px solid var(--rule);padding:8px 12px;flex-wrap:wrap}
.btn{background:none;border:1px solid var(--rule);color:var(--ink);padding:4px 12px;font-size:13.5px;cursor:pointer;line-height:1.6}
.btn:hover{border-color:var(--ink2)}
.btn:disabled{opacity:.35;cursor:default}
.btn.pri{background:var(--ink);color:var(--card);border-color:var(--ink)}
.stepno{font:600 14px var(--math);color:var(--ink2);min-width:58px;text-align:center}
.dots{display:flex;gap:4px;margin-left:auto}
.dots i{width:16px;height:4px;background:var(--rule);cursor:pointer}
.dots i.on{background:var(--known)}
.ctrl{padding:8px 14px 10px;border-top:1px solid var(--rule);display:grid;gap:4px;font-size:13.5px}
.ctrl:empty{display:none}
.ctrl label{display:flex;justify-content:space-between;color:var(--ink2)}
.ctrl label span:last-child{font-family:var(--math);color:var(--ink)}
.ctrl input[type=range]{width:100%;accent-color:var(--known);margin:0}
.readout{font-size:13.5px;color:var(--ink2);line-height:1.7}
.readout b{color:var(--res);font-weight:600}
.legend{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);padding:7px 12px;border-top:1px solid var(--rule)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend span i{display:inline-block;width:18px;height:3px}

.steps{list-style:none;margin:0;padding:0}
.steps li{position:relative;padding:13px 16px 14px 54px;border:1px solid transparent;border-bottom-color:var(--rule);cursor:pointer;transition:background .25s,opacity .25s}
.steps li .n{position:absolute;left:14px;top:15px;width:26px;height:26px;border:1.5px solid var(--muted);font:600 13.5px/23px var(--math);text-align:center;color:var(--muted)}
.steps li.on{background:var(--card);border-color:var(--rule);border-left:3px solid var(--known);padding-left:52px}
.steps li.on .n{background:var(--known);border-color:var(--known);color:#fff}
.steps li.later{opacity:.45}
.steps li.later:hover{opacity:.8}
.steps h4{margin:0 0 3px;font:600 15.5px/1.5 var(--sans)}
.steps .bd{font-size:14.5px;color:var(--ink2)}
.steps .bd p{margin:4px 0}

/* 公式 */
.mx{font-family:var(--math);font-size:1.07em;white-space:nowrap}
.mx i,.eq i,.wl i{font-style:italic}
.eq{font-family:var(--math);font-size:16.5px;margin:7px 0;padding:6px 12px;background:var(--soft);border-left:2px solid var(--geo);overflow-x:auto;white-space:nowrap;line-height:2.1;color:var(--ink)}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 3px;font-size:.9em;line-height:1.25}
.fr>span:first-child{border-bottom:1px solid currentColor;padding:0 3px 1px}
.fr>span:last-child{padding:1px 3px 0}
.sqrt{white-space:nowrap}
.sqrt .rad{border-top:1px solid currentColor;padding:0 2px;margin-left:1px}
sub,sup{font-size:.7em;line-height:0}
.tip{font-size:13.5px;margin-top:8px;padding:5px 10px;border-left:2px solid var(--hl);color:var(--ink2);background:color-mix(in srgb,var(--hl) 9%,transparent)}
.tip b{color:var(--hl)}

/* 作业本写法 */
.blk{margin-top:36px}
.blk>h3{font:700 18px var(--serif);margin:0 0 10px;display:flex;align-items:center;gap:12px}
.blk>h3 .btn{font:13px var(--sans);margin-left:auto}
.write{background:var(--card);border:1px solid var(--rule);padding:16px 24px 16px 46px;position:relative;
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 39px,var(--rule) 39px,var(--rule) 40px);background-position:0 15px}
.write::before{content:"";position:absolute;left:28px;top:0;bottom:0;border-left:1px solid color-mix(in srgb,var(--known) 45%,transparent)}
.wl{min-height:40px;line-height:40px;font-size:15.5px;font-family:var(--math),var(--sans);white-space:nowrap;overflow-x:auto;overflow-y:hidden}
.wl .fr{line-height:1.15;font-size:.85em}
.wl.zh{font-family:var(--sans);white-space:normal;line-height:40px}
.ans{border:2px solid var(--res);padding:12px 18px;margin-top:18px;background:color-mix(in srgb,var(--res) 6%,var(--card))}
.ans b{color:var(--res);font-weight:700;letter-spacing:.1em;margin-right:10px}
.pit{margin:18px 0 0;padding:0;list-style:none}
.pit li{padding:6px 0 6px 26px;position:relative;color:var(--ink2);font-size:14.5px;border-bottom:1px dashed var(--rule)}
.pit li::before{content:"!";position:absolute;left:4px;top:7px;width:15px;height:15px;border:1.5px solid var(--known);color:var(--known);font:700 11px/12px var(--sans);text-align:center}
.pn{display:flex;justify-content:space-between;gap:12px;margin-top:40px;border-top:1px solid var(--rule);padding-top:16px}
.pn a{text-decoration:none;font-size:14px;color:var(--ink2);max-width:48%}
.pn a:hover{color:var(--known)}
.pn small{display:block;color:var(--muted);font-size:12px}

/* SVG 图元 */
.dg text{user-select:none}
.ln{stroke:var(--ink);stroke-width:1.6;fill:none}
.frm{stroke:var(--ink);stroke-width:3;fill:none;stroke-linejoin:miter}
.rope{stroke:var(--ink);stroke-width:1.8;fill:none}
.dsh{stroke:var(--geo);stroke-width:1.3;stroke-dasharray:6 5;fill:none}
.dsh.r{stroke:var(--res)}
.dsh.h{stroke:var(--hl);stroke-width:1.6}
.dd{stroke:var(--geo);stroke-width:1.2;stroke-dasharray:12 4 2 4;fill:none}
.rodO{stroke:var(--ink);stroke-width:10;fill:none;stroke-linejoin:miter;stroke-linecap:butt}
.rodI{stroke:var(--card);stroke-width:6;fill:none;stroke-linejoin:miter;stroke-linecap:butt}
.rod{transition:opacity .5s}
.hot .rodO{stroke:var(--hl);animation:hotp 1.2s ease-in-out infinite}
.hot .rodI{stroke:color-mix(in srgb,var(--hl) 22%,var(--card))}
.hot.cplg{--fc:var(--hl)}
@keyframes hotp{50%{stroke-width:12}}
.pinc{fill:var(--card);stroke:var(--ink);stroke-width:1.6}
.sup{fill:var(--card);stroke:var(--ink);stroke-width:1.5;stroke-linejoin:round}
.gl{stroke:var(--ink);stroke-width:1.6}
.ht{stroke:var(--ink);stroke-width:1}
.body{fill:var(--card);stroke:var(--ink);stroke-width:1.6;stroke-linejoin:round}
.inkf{fill:var(--ink)}
.arc{stroke:var(--hl);stroke-width:1.4;fill:none}
.arcT{fill:var(--hl);font:italic 15px var(--math)}
.arc.r{stroke:var(--res)}.arcT.r{fill:var(--res)}
.lb{font:italic 18px var(--math);fill:var(--ink)}
.lb .sb{font-style:normal;font-size:12.5px}
.pt{font:italic 17px var(--math);fill:var(--ink)}
.nt{font:13px var(--sans);fill:var(--muted)}
.nt.r{fill:var(--res);font-weight:600}
.big{font:600 17px var(--math);fill:var(--res)}
.vl{font:12.5px var(--sans);fill:var(--fc)}
.dm{stroke:var(--muted);stroke-width:1}
.dmh{fill:var(--muted)}
.dmt{font:italic 15px var(--math);fill:var(--ink2)}
.rtm{stroke:var(--hl);stroke-width:1.3;fill:none}
.focus{stroke:var(--hl);stroke-width:1.6;stroke-dasharray:4 3;fill:none}

.arw{--fc:var(--known)}
.arw.u{--fc:var(--unk)}
.arw.r{--fc:var(--res)}
.arw.g{--fc:var(--geo)}
.arw.ax{--fc:var(--axis)}
.arw line{stroke:var(--fc);stroke-width:2.6;stroke-linecap:round}
.arw.ax line{stroke-width:1.2}
.arw line.dsl{stroke-dasharray:6 4;stroke-width:2}
.arw path{fill:var(--fc)}
.arw .lb{fill:var(--fc)}
.arw.ax .lb{font-size:15px}
.cplg{--fc:var(--known)}
.cplg.r{--fc:var(--res)}
.cplg.u{--fc:var(--unk)}
.hole{fill:var(--bg);stroke:var(--ink);stroke-width:1.2}
.rm{font-style:normal}
.kdot{fill:var(--hl)}
.cpl{stroke:var(--fc);fill:none;stroke-width:2.4}
.cplh{fill:var(--fc)}
.cplt{fill:var(--fc)}

/* 第三、四章图元 */
.ql{--fc:var(--known)}
.ql line{stroke:var(--known);stroke-width:1.5}
.ql path{fill:var(--known)}
.ql .lb{fill:var(--known)}
.bar{stroke:var(--ink);stroke-width:3.2;stroke-linecap:round}
.bar.zero{stroke:var(--geo);stroke-width:2.2;stroke-dasharray:7 5}
.bar.hotbar{stroke:var(--hl);stroke-width:5}
.mn{font:13px var(--math);fill:var(--ink2)}
.zl{font:600 12.5px var(--sans);fill:var(--known)}
.wedge{fill:color-mix(in srgb,var(--hl) 30%,transparent);stroke:none}
.slot{stroke:var(--ink);stroke-width:12;fill:none;stroke-linecap:round}
.slotI{stroke:var(--card);stroke-width:8;fill:none;stroke-linecap:round}
.trace{stroke:var(--res);stroke-width:1.6;stroke-dasharray:5 4;fill:none}
.cut{stroke:var(--known);stroke-width:1.8;stroke-dasharray:10 5;fill:none}


/* 受力平衡图 */
.balp .fly{transition:transform .9s cubic-bezier(.2,.8,.2,1),opacity .45s}
.balp.pre .fly{transform:translate(var(--fx),var(--fy));opacity:0}
.balp .late{transition:opacity .5s}
.balp.pre .late{opacity:0}
.bt{font:600 16px var(--sans);fill:var(--ink)}
.bv{font:12.5px var(--sans);font-style:normal}
.replay{font:13px var(--sans);fill:var(--unk);cursor:pointer;text-decoration:underline}

/* 分步显隐 */
[data-s]{opacity:0;transition:opacity .5s ease}
[data-s].on{opacity:1}
.arw[data-s]{transform:scale(.04);transition:transform .7s cubic-bezier(.2,.8,.25,1),opacity .3s}
.arw[data-s].on{transform:none}
[data-tk]{transition:transform 1s cubic-bezier(.4,0,.2,1)}
[data-dk]{transition:opacity .5s}
.dim{opacity:.16 !important}
.instant,.instant *{transition:none !important}
.spin{animation:spin linear infinite}
.spin.ccw{animation-name:spinccw}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinccw{to{transform:rotate(-360deg)}}
.paused .spin{animation-play-state:paused}
@media (prefers-reduced-motion: reduce){
  [data-s],.arw[data-s],[data-tk]{transition-duration:.01s !important}
  .spin{animation:none}
  .hot .rodO{animation:none}
}

/* 入门页、汇总页 */
.lead{font-size:15.5px;color:var(--ink2);max-width:860px}
.pr{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:16px;margin-top:22px}
.prc{background:var(--card);border:1px solid var(--rule);padding:16px 20px 18px}
.prc h3{font:700 17px var(--serif);margin:0 0 6px}
.prc p{margin:6px 0;font-size:14.5px;color:var(--ink2)}
.prc svg{display:block;width:100%;height:auto;margin:6px 0}
.prc.wide{grid-column:1/-1}
.cons{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.cons figure{margin:0;border:1px solid var(--rule);padding:6px 8px 8px;background:var(--bg)}
.cons figcaption{font-size:13px;color:var(--ink2);line-height:1.6}
.cons figcaption b{display:block;color:var(--ink);font-size:14px}
.four{margin:6px 0 0;padding-left:0;list-style:none;counter-reset:f}
.four li{counter-increment:f;padding:6px 0 6px 36px;position:relative;font-size:14.5px;color:var(--ink2);border-bottom:1px dashed var(--rule)}
.four li::before{content:counter(f);position:absolute;left:0;top:7px;width:24px;height:24px;background:var(--ink);color:var(--card);font:600 13px/24px var(--math);text-align:center}
.four li b{color:var(--ink)}
table.sum{width:100%;border-collapse:collapse;margin-top:16px;font-size:14.5px;background:var(--card)}
table.sum th,table.sum td{border:1px solid var(--rule);padding:9px 12px;text-align:left;vertical-align:top}
table.sum th{background:var(--soft);font-weight:600;font-size:13px;color:var(--ink2);letter-spacing:.05em}
table.sum td:first-child{white-space:nowrap;font-family:var(--math);font-weight:600}
table.sum a{text-decoration:none;border-bottom:1px solid var(--rule)}
table.sum a:hover{color:var(--known)}
.kbd{font:12px var(--math);border:1px solid var(--rule);padding:0 5px;background:var(--card)}

@media (max-width: 960px){
  .top{padding:10px 16px}
  .top .sub{display:none}
  .shell{grid-template-columns:1fr}
  .side{position:sticky;top:0;height:auto;display:flex;overflow-x:auto;padding:0;border-right:none;border-bottom:1px solid var(--rule);background:var(--bg);z-index:6;scrollbar-width:none}
  .side::-webkit-scrollbar{display:none}
  .side h4{display:none}
  .side a{border-left:none;border-bottom:3px solid transparent;white-space:nowrap;padding:9px 11px 7px}
  .side a .t{display:none}
  .side a.on{border-bottom-color:var(--known)}
  main{padding:18px 16px 90px}
  .ph h2{font-size:21px}
  .stage{grid-template-columns:1fr;gap:14px}
  .fig{position:sticky;top:44px;z-index:4}
  .fig .legend{display:none}
  .pr{grid-template-columns:1fr}
  .cons{grid-template-columns:repeat(2,minmax(0,1fr))}
  .write{padding:12px 14px 12px 34px}
  .write::before{left:20px}
}

/* 手机端 */
.khead,.shead,.mbar,.omore{display:none}
.fr,.sqrt{white-space:nowrap}
.measure [data-s]{opacity:1 !important;transform:none !important}
@media (max-width: 960px){
  body{font-size:15px}
  main{overflow-x:clip;padding-bottom:130px}
  .top h1{font-size:17px}
  .tag{font-size:12px}
  .orig{font-size:14px;padding-left:11px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:2px}
  .orig.open{display:block}
  .omore{display:inline-block;background:none;border:none;color:var(--unk);font-size:13px;padding:0 0 0 14px;margin:0 0 10px;cursor:pointer}
  .given{font-size:14px}
  .mx{white-space:normal}
  .eq{white-space:normal;overflow-x:visible;font-size:16px;line-height:1.85;padding:6px 10px}
  .wl{white-space:normal;overflow:visible}
  .khead{display:block;font-size:12.5px;color:var(--muted);margin:16px 0 6px;letter-spacing:.04em}
  .know{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;margin:0 -16px 16px;padding:0 16px 4px;scrollbar-width:none}
  .know::-webkit-scrollbar{display:none}
  .kc{flex:0 0 84%;scroll-snap-align:center}
  .fig{top:40px;box-shadow:0 1px 0 var(--rule)}
  .fig svg.dg{max-height:44vh;margin:0 auto}
  .figbar{display:none}
  .vtabs button{padding:7px 4px;font-size:13.5px}
  .ctrl{padding:6px 12px 8px;font-size:13px}
  .readout{font-size:13px}
  .shead{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted);padding:0 2px}
  .shead .btn{font-size:12.5px;padding:2px 10px}
  .steps li{display:none;padding:12px 14px 14px;background:var(--card);border:1px solid var(--rule);cursor:default}
  .steps li .n{display:none}
  .steps li.on{display:block;border-left:3px solid var(--known);padding-left:14px}
  .steps h4{font-size:16.5px;margin-bottom:4px}
  .steps .bd{font-size:15px;line-height:1.85}
  .steps.all li{display:block;padding:12px 14px 14px 50px;cursor:pointer}
  .steps.all li .n{display:block;left:12px;top:13px}
  .steps.all li.on{padding-left:48px}
  .mbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;gap:10px;align-items:center;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--rule)}
  .mbar .btn{flex:1;height:46px;font-size:16px;touch-action:manipulation}
  .mprog{display:flex;gap:4px;flex:0 0 auto}
  .mprog i{width:7px;height:7px;background:var(--rule)}
  .mprog i.on{background:var(--known)}

<body>
<header class="top">
  <h1>工程力学作业讲解</h1>
  <span class="sub">四章 21 题：平面汇交力系 · 平面力偶系 · 平面任意力系 · 点的运动</span>
  <button class="theme" id="theme">主题</button>
</header>
<div class="shell">
  <nav class="side" id="nav"></nav>
  <main id="main"></main>
</div>
<script>
'use strict';
/* ========== 数学与格式 ========== */
const RAD = Math.PI / 180;
const f = n => Math.round(n * 10) / 10;
// 数学角（度，逆时针为正）→ 屏幕坐标
const pol = (x, y, l, d) => [x + l * Math.cos(d * RAD), y - l * Math.sin(d * RAD)];

function at(o) {
  if (!o) return '';
  let s = '';
  if (o.s != null) s += ` data-s="${o.s}"`;
  else if (o.u != null) s += ` data-s="0"`;
  if (o.u != null) s += ` data-u="${o.u}"`;
  if (o.tk != null) s += ` data-tk="${o.tk}" data-tf="${o.tf}"`;
  if (o.dk != null) s += ` data-dk="${o.dk}"` + (o.du != null ? ` data-du="${o.du}"` : '');
  if (o.hk != null) s += ` data-hk="${o.hk}"`;
  if (o.style) s += ` style="${o.style}"`;
  return s;
}
// 标签：F_AB → F 加下标
function lab(t) {
  return String(t).replace(/([A-Za-zθβγαφω][′']?)_\{([^}]*)\}|([A-Za-zθβγαφω][′']?)_([A-Za-z0-9′']+)/g,
    (m, a, b, c, d) => `${a || c}<tspan class="sb" dy="5">${b || d}</tspan><tspan dy="-5">​</tspan>`);
}

/* 简易公式：$...$ 行内，$$...$$ 独立行；#frac{}{}、#sqrt{}、#t{直立}、_ 下标、^ 上标 */
function tex(s, up) {
  let out = '', i = 0;
  const group = () => {
    while (s[i] === ' ') i++;
    if (s[i] === '{') {
      let d = 0, j = i;
      for (; j < s.length; j++) { if (s[j] === '{') d++; else if (s[j] === '}') { d--; if (!d) break; } }
      const r = s.slice(i + 1, j); i = j + 1; return r;
    }
    return s[i++] || '';
  };
  while (i < s.length) {
    const c = s[i];
    if (c === '#') {
      const m = /^#([a-z]+)/.exec(s.slice(i));
      if (m) {
        i += m[0].length;
        if (m[1] === 'frac') { const a = group(), b = group(); out += `<span class="fr"><span>${tex(a, up)}</span><span>${tex(b, up)}</span></span>`; }
        else if (m[1] === 'sqrt') { const a = group(); out += `<span class="sqrt">√<span class="rad">${tex(a, up)}</span></span>`; }
        else if (m[1] === 't') { out += group(); }
        continue;
      }
    }
    if (c === '_' || c === '^') { i++; const a = group(); out += c === '_' ? `<sub>${tex(a, true)}</sub>` : `<sup>${tex(a, up)}</sup>`; continue; }
    if (/[A-Za-z]/.test(c)) {
      let j = i; while (j < s.length && /[A-Za-z]/.test(s[j])) j++;
      const w = s.slice(i, j); i = j;
      const fm = /^([A-Za-z])(sin|cos|tan)$/.exec(w);
      if (fm && !up) { out += `<i>${fm[1]}</i>${fm[2]}`; continue; }
      out += (w.length === 1 && !up) ? `<i>${w}</i>` : w; continue;
    }
    if ('θβγαφω'.includes(c) && !up) { out += `<i>${c}</i>`; i++; continue; }
    if (c === '=' && !up) { out += '=<wbr>'; i++; continue; }
    if (c === ' ') { out += '&nbsp;'; i++; continue; }
    if (c === '⇒') { out += '<wbr>⇒'; i++; continue; }
    if (c === '-') { out += '−'; i++; continue; }
    if (c === '*') { out += '×'; i++; continue; }
    if (c === '<') { out += '&lt;'; i++; continue; }
    out += c; i++;
  }
  return out;
}
// 公式转成纯文本，给"复制文字"用
function texPlain(s) {
  let out = '', i = 0;
  const sup = { '2': '²', '3': '³' };
  const group = () => {
    while (s[i] === ' ') i++;
    if (s[i] === '{') { let d = 0, j = i; for (; j < s.length; j++) { if (s[j] === '{') d++; else if (s[j] === '}') { d--; if (!d) break; } } const r = s.slice(i + 1, j); i = j + 1; return r; }
    return s[i++] || '';
  };
  const wrap = x => /^(\d+(\.\d+)?|[A-Za-zθαβγ][A-Za-z0-9′]{0,2}|√\d+)$/.test(x) ? x : '(' + x + ')';
  while (i < s.length) {
    const c = s[i];
    const m = c === '#' && /^#([a-z]+)/.exec(s.slice(i));
    if (m) {
      i += m[0].length;
      if (m[1] === 'frac') { const a = texPlain(group()), b = texPlain(group()); out += wrap(a) + '/' + wrap(b); }
      else if (m[1] === 'sqrt') out += '√' + wrap(texPlain(group()));
      else out += group();
      continue;
    }
    if (c === '_') { i++; out += texPlain(group()); continue; }
    if (c === '^') { i++; const a = texPlain(group()); out += sup[a] || '^' + a; continue; }
    out += c === '-' ? '−' : c === '*' ? '×' : c; i++;
  }
  return out;
}
function plainLine(h) { return String(h).replace(/\$\$?([^$]+?)\$\$?/g, (m, a) => texPlain(a)).replace(/<[^>]+>/g, ''); }
function T(h) {
  if (!h) return '';
  return String(h)
    .replace(/\$\$([\s\S]+?)\$\$/g, (m, a) => `<div class="eq">${tex(a.trim())}</div>`)
    .replace(/\$([^$]+?)\$/g, (m, a) => `<span class="mx">${tex(a)}</span>`);
}

/* ========== SVG 图元 ========== */
const D = {
  g: (c, o = {}, cls = '') => `<g${cls ? ` class="${cls}"` : ''}${at(o)}>${c}</g>`,
  ln: (x1, y1, x2, y2, cls = 'ln', o = {}) => `<line x1="${f(x1)}" y1="${f(y1)}" x2="${f(x2)}" y2="${f(y2)}" class="${cls}"${at(o)}/>`,
  pl: (pts, cls = 'ln', o = {}) => `<polyline points="${pts.map(p => f(p[0]) + ',' + f(p[1])).join(' ')}" class="${cls}"${at(o)}/>`,
  rod(pts, o = {}) {
    const P = pts.map(p => f(p[0]) + ',' + f(p[1])).join(' ');
    return `<g class="rod${o.cls ? ' ' + o.cls : ''}"${at(o)}><polyline points="${P}" class="rodO"/><polyline points="${P}" class="rodI"/></g>`;
  },
  pin: (x, y, o = {}) => `<circle cx="${f(x)}" cy="${f(y)}" r="${o.r || 5}" class="pinc"${at(o)}/>`,
  hatch(x1, y1, x2, y2, side = 1, o = {}) {
    const L = Math.hypot(x2 - x1, y2 - y1), dx = (x2 - x1) / L, dy = (y2 - y1) / L, nx = -dy * side, ny = dx * side;
    let s = `<line x1="${f(x1)}" y1="${f(y1)}" x2="${f(x2)}" y2="${f(y2)}" class="gl"/>`;
    const n = Math.max(2, Math.floor(L / 8));
    for (let i = 0; i <= n; i++) {
      const px = x1 + dx * (i * L / n), py = y1 + dy * (i * L / n);
      s += `<line x1="${f(px)}" y1="${f(py)}" x2="${f(px + nx * 7 - dx * 6)}" y2="${f(py + ny * 7 - dy * 6)}" class="ht"/>`;
    }
    return D.g(s, o);
  },
  // 固定铰支座：rot 为屏幕旋转角（顺时针为正）
  fixed(x, y, rot = 0, o = {}) {
    let s = `<path d="M${x},${y} L${x - 13},${y + 22} L${x + 13},${y + 22} Z" class="sup"/>` + D.hatch(x - 22, y + 22, x + 22, y + 22, 1) + `<circle cx="${x}" cy="${y}" r="5" class="pinc"/>`;
    return `<g transform="rotate(${rot} ${x} ${y})"${at(o)}>${s}</g>`;
  },
  roller(x, y, rot = 0, o = {}) {
    let s = `<path d="M${x},${y} L${x - 12},${y + 15} L${x + 12},${y + 15} Z" class="sup"/><circle cx="${x - 7}" cy="${y + 19.5}" r="4" class="pinc"/><circle cx="${x + 7}" cy="${y + 19.5}" r="4" class="pinc"/>` + D.hatch(x - 22, y + 24, x + 22, y + 24, 1) + `<circle cx="${x}" cy="${y}" r="5" class="pinc"/>`;
    return `<g transform="rotate(${rot} ${x} ${y})"${at(o)}>${s}</g>`;
  },
  txt: (x, y, t, cls = 'pt', o = {}) => `<text x="${f(x)}" y="${f(y)}" class="${cls}" text-anchor="${o.a || 'middle'}"${at(o)}>${lab(t)}</text>`,
  note: (x, y, t, o = {}) => `<text x="${f(x)}" y="${f(y)}" class="nt${o.c ? ' ' + o.c : ''}" text-anchor="${o.a || 'middle'}"${at(o)}>${t}</text>`,
  arc(cx, cy, r, a1, a2, label, o = {}) {
    const [x1, y1] = pol(cx, cy, r, a1), [x2, y2] = pol(cx, cy, r, a2);
    const big = Math.abs(a2 - a1) > 180 ? 1 : 0, sweep = a2 > a1 ? 0 : 1;
    let s = `<path d="M${f(x1)},${f(y1)} A${r},${r} 0 ${big} ${sweep} ${f(x2)},${f(y2)}" class="arc ${o.c || ''}"/>`;
    if (label) {
      const m = o.am != null ? o.am : (a1 + a2) / 2;
      const [lx, ly] = o.lp || pol(cx, cy, r + (o.lo || 15), m);
      s += `<text x="${f(lx)}" y="${f(ly + 5)}" class="arcT ${o.c || ''}" text-anchor="middle">${lab(label)}</text>`;
    }
    return D.g(s, o);
  },
  // 力偶：cw=true 顺时针。可用 o.a1/o.a2 指定弧的起止（数学角）
  couple(cx, cy, r, cw, label, o = {}) {
    const a1 = o.a1 != null ? o.a1 : (cw ? 215 : -35), a2 = o.a2 != null ? o.a2 : (cw ? -35 : 215);
    const [x1, y1] = pol(cx, cy, r, a1), [x2, y2] = pol(cx, cy, r, a2);
    const span = Math.abs(a2 - a1);
    let s = `<path d="M${f(x1)},${f(y1)} A${r},${r} 0 ${span > 180 ? 1 : 0} ${cw ? 1 : 0} ${f(x2)},${f(y2)}" class="cpl"/>`;
    const tx = cw ? Math.sin(a2 * RAD) : -Math.sin(a2 * RAD), ty = cw ? Math.cos(a2 * RAD) : -Math.cos(a2 * RAD);
    const h = 12, w = 5.5, bx = x2 - tx * h * 0.6, by = y2 - ty * h * 0.6, ex = x2 + tx * h * 0.4, ey = y2 + ty * h * 0.4;
    s += `<path d="M${f(ex)},${f(ey)} L${f(bx - ty * w)},${f(by + tx * w)} L${f(bx + ty * w)},${f(by - tx * w)} Z" class="cplh"/>`;
    if (label) { const [lx, ly] = o.lp || [cx, cy - r - 9]; s += `<text x="${f(lx)}" y="${f(ly)}" class="lb cplt" text-anchor="middle">${lab(label)}</text>`; }
    return D.g(s, o, 'cplg ' + (o.c || 'k'));
  },
  arrow(x1, y1, x2, y2, o = {}) {
    const L = Math.hypot(x2 - x1, y2 - y1) || 1, ux = (x2 - x1) / L, uy = (y2 - y1) / L, h = o.h || 14, w = o.w || 5.5;
    const bx = x2 - ux * h, by = y2 - uy * h;
    let s = `<line x1="${f(x1)}" y1="${f(y1)}" x2="${f(bx + ux * 2)}" y2="${f(by + uy * 2)}"${o.dash ? ' class="dsl"' : ''}/><path d="M${f(x2)},${f(y2)} L${f(bx - uy * w)},${f(by + ux * w)} L${f(bx + uy * w)},${f(by - ux * w)} Z"/>`;
    if (o.l) {
      const [lx, ly] = o.lp || [x2 + ux * 12 - uy * 14, y2 + uy * 12 + ux * 14 + 5];
      s += `<text x="${f(lx)}" y="${f(ly)}" class="lb" text-anchor="${o.la || 'middle'}">${lab(o.l)}</text>`;
    }
    if (o.v) { const [vx, vy] = o.vp; s += `<text x="${f(vx)}" y="${f(vy)}" class="vl" text-anchor="${o.va || 'middle'}">${o.v}</text>`; }
    const oo = Object.assign({}, o, { style: `transform-origin:${f(x1)}px ${f(y1)}px` + (o.style ? ';' + o.style : '') });
    return `<g class="arw ${o.c || 'k'}"${at(oo)}>${s}</g>`;
  },
  // 从点出发的力
  af(x, y, len, deg, o = {}) { const g = o.g || 0; const [sx, sy] = pol(x, y, g, deg), [ex, ey] = pol(x, y, g + len, deg); return D.arrow(sx, sy, ex, ey, o); },
  // 指向点的力（箭头尖在点上）
  ai(x, y, len, deg, o = {}) { const g = o.g != null ? o.g : 7; const [sx, sy] = pol(x, y, g + len, deg + 180), [ex, ey] = pol(x, y, g, deg + 180); return D.arrow(sx, sy, ex, ey, o); },
  dim(x1, y1, x2, y2, label, o = {}) {
    const L = Math.hypot(x2 - x1, y2 - y1), dx = (x2 - x1) / L, dy = (y2 - y1) / L, h = 8, w = 3;
    const head = (x, y, sx, sy) => `<path d="M${f(x)},${f(y)} L${f(x - sx * h - sy * w)},${f(y - sy * h + sx * w)} L${f(x - sx * h + sy * w)},${f(y - sy * h - sx * w)} Z" class="dmh"/>`;
    const nx = -dy, ny = dx;
    let s = `<line x1="${f(x1)}" y1="${f(y1)}" x2="${f(x2)}" y2="${f(y2)}" class="dm"/>` + head(x2, y2, dx, dy) + head(x1, y1, -dx, -dy);
    s += `<line x1="${f(x1 + nx * 7)}" y1="${f(y1 + ny * 7)}" x2="${f(x1 - nx * 7)}" y2="${f(y1 - ny * 7)}" class="dm"/><line x1="${f(x2 + nx * 7)}" y1="${f(y2 + ny * 7)}" x2="${f(x2 - nx * 7)}" y2="${f(y2 - ny * 7)}" class="dm"/>`;
    const off = o.off != null ? o.off : -12;
    const mx = (x1 + x2) / 2 + nx * off, my = (y1 + y2) / 2 + ny * off;
    s += `<text x="${f(mx)}" y="${f(my + 5)}" class="dmt" text-anchor="middle">${lab(label)}</text>`;
    return D.g(s, o);
  },
  rt(x, y, d1, d2, sz = 10, o = {}) {
    const [ax, ay] = pol(x, y, sz, d1), [cx, cy] = pol(x, y, sz, d2);
    return D.pl([[ax, ay], [ax + cx - x, ay + cy - y], [cx, cy]], 'rtm', o);
  },
  axes(x, y, o = {}) {
    const L = o.len || 100, B = o.back || 20, r = o.rot || 0;
    const ax = (d, lb) => { const [sx, sy] = pol(x, y, B, d + 180), [ex, ey] = pol(x, y, L, d); const [lx, ly] = pol(x, y, L + 13, d); return D.arrow(sx, sy, ex, ey, { c: 'ax', h: 10, w: 4, l: lb, lp: [lx, ly + 5] }); };
    return D.g(ax(r, o.lx || 'x') + ax(r + 90, o.ly || 'y'), o);
  }
};

/* ========== 题目注册与渲染 ========== */
const PROBS = [];
const reg = p => PROBS.push(p);
const S = { p: null, vi: 0, cur: 0, params: {}, timer: null };
const $ = sel => document.querySelector(sel);

function legendHTML() {
  return `<div class="legend"><span><i style="background:var(--known)"></i>已知的力</span><span><i style="background:var(--unk)"></i>待求的力</span><span><i style="background:var(--res)"></i>算出来的结果</span><span><i style="background:var(--geo)"></i>辅助线</span></div>`;
}

function renderProb(p) {
  const idx = PROBS.indexOf(p), prev = PROBS[idx - 1], next = PROBS[idx + 1];
  const tabs = p.variants.length > 1 ? `<div class="vtabs">${p.variants.map((v, i) => `<button data-vi="${i}">${v.label}</button>`).join('')}</div>` : '';
  $('#main').innerHTML = `
  <article class="prob">
    <div class="ph">
      <div class="tag">${p.tag}</div>
      <h2>${p.title}</h2>
      <div class="orig" id="orig">${T(p.orig)}</div><button class="omore" id="omore">展开原题</button>
      <div class="given"><b>已知</b><div>${T(p.given)}</div><b>要求</b><div>${T(p.ask)}</div></div>
    </div>
    <div class="khead">先搞懂这几个概念（左右滑动）</div>
    <div class="know">${p.know.map(k => `<div class="kc"><h5>${k[0]}</h5><p>${T(k[1])}</p></div>`).join('')}</div>
    <div class="stage">
      <div class="fig" id="fig">
        ${tabs}
        <div id="svgw"></div>
        <div class="figbar">
          <button class="btn" id="bPrev" title="上一步（←）">上一步</button>
          <span class="stepno" id="stepno"></span>
          <button class="btn pri" id="bNext" title="下一步（→）">下一步</button>
          <button class="btn" id="bPlay">自动播放</button>
          <span class="dots" id="dots"></span>
        </div>
        <div class="ctrl" id="ctrl"></div>
        ${legendHTML()}
      </div>
      <div class="shead"><span id="shno"></span><button class="btn" id="bAll">展开全部步骤</button></div>
      <ol class="steps" id="steps"></ol>
    </div>
    <section class="blk"><h3>作业本上这样写 <button class="btn" id="bCopy">复制文字</button></h3><div class="write" id="write"></div></section>
    <div class="ans" id="ans"></div>
    <section class="blk" id="pitw"><h3>容易错的地方</h3><ul class="pit" id="pit"></ul></section>
    <nav class="pn">
      ${prev ? `<a href="#${prev.id}"><small>上一题</small>${prev.nav} ${prev.short}</a>` : `<a href="#intro"><small>上一页</small>先看这页</a>`}
      ${next && next.ch !== p.ch ? `<a href="#${CHAPTERS[next.ch].id}" style="text-align:right"><small>下一章</small>${CHAPTERS[next.ch].no} ${CHAPTERS[next.ch].name}</a>` : next ? `<a href="#${next.id}" style="text-align:right"><small>下一题</small>${next.nav} ${next.short}</a>` : `<a href="#sum" style="text-align:right"><small>最后</small>答案汇总</a>`}
    </nav>
    <div class="mbar"><button class="btn" id="mPrev">上一步</button><span class="mprog" id="mprog"></span><button class="btn pri" id="mNext">下一步</button></div>
  </article>`;
  $('#bPrev').onclick = () => go(S.cur - 1);
  $('#bNext').onclick = () => go(S.cur + 1);
  $('#bPlay').onclick = togglePlay;
  $('#bCopy').onclick = copyWrite;
  $('#omore').onclick = () => { const o = $('#orig'); o.classList.toggle('open'); $('#omore').textContent = o.classList.contains('open') ? '收起原题' : '展开原题'; };
  $('#mPrev').onclick = () => { stop(); go(S.cur - 1); };
  $('#mNext').onclick = () => {
    stop();
    if (S.cur < allSteps(V()).length - 1) go(S.cur + 1);
    else { const nx = PROBS[PROBS.indexOf(S.p) + 1]; location.hash = nx ? nx.id : 'sum'; }
  };
  $('#bAll').onclick = () => { const el = $('#steps'); el.classList.toggle('all'); $('#bAll').textContent = el.classList.contains('all') ? '只看当前步' : '展开全部步骤'; };
  // 在图上左右滑动翻步
  let tx = null, ty = 0;
  $('#svgw').addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
  $('#svgw').addEventListener('touchend', e => {
    if (tx == null) return;
    const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty; tx = null;
    if (Math.abs(dx) > 45 && Math.abs(dy) < 50) { stop(); go(S.cur + (dx < 0 ? 1 : -1)); }
  }, { passive: true });
  document.querySelectorAll('.vtabs button').forEach(b => b.onclick = () => { stop(); S.vi = +b.dataset.vi; S.cur = 0; renderVariant(); });
  renderVariant();
}

function V() { return S.p.variants[S.vi]; }
function pick(k) { const v = V(); return v[k] != null ? v[k] : S.p[k]; }

function renderVariant() {
  stopAnim();
  const v = V();
  document.querySelectorAll('.vtabs button').forEach(b => b.classList.toggle('on', +b.dataset.vi === S.vi));
  S.params = {};
  for (const k in (v.params || {})) S.params[k] = v.params[k].val;
  S.balShown = -1;
  drawSVG(true);
  // 步骤
  $('#steps').innerHTML = allSteps(v).map((st, i) => `<li data-i="${i}"><span class="n">${i}</span><h4>${T(st[0])}</h4><div class="bd">${T(st[1])}</div></li>`).join('');
  document.querySelectorAll('#steps li').forEach(li => li.onclick = () => { stop(); go(+li.dataset.i); });

function updReadout() { const v = V(); if (v.readout && $('#readout')) $('#readout').innerHTML = T(v.readout(S.params)); }

// 量出整张图（所有步骤、滑块两端）的范围，裁掉四周空白
function fitBox(v) {
  if (v._fit) return v._fit;
  const ns = 'http://www.w3.org/2000/svg', m = document.createElementNS(ns, 'svg');
  m.setAttribute('class', 'dg measure'); m.setAttribute('viewBox', '0 0 640 460');
  m.style.cssText = 'position:absolute;left:-9999px;top:0;width:640px;height:460px;visibility:hidden';
  document.body.appendChild(m);
  const base = {}; for (const k in (v.params || {})) base[k] = v.params[k].val;
  const sets = [base];
  for (const k in (v.params || {})) { const pm = v.params[k]; for (let i = 0; i <= 8; i++) sets.push(Object.assign({}, base, { [k]: pm.min + (pm.max - pm.min) * i / 8 })); }
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const ps of sets) {
    m.innerHTML = '<g>' + v.svg(ps) + '</g>';
    const b = m.firstChild.getBBox();
    x0 = Math.min(x0, b.x); y0 = Math.min(y0, b.y); x1 = Math.max(x1, b.x + b.width); y1 = Math.max(y1, b.y + b.height);
  }
  m.remove();
  const pad = 12;
  if (!(x1 > x0)) return (v._fit = '0 0 640 460');
  return (v._fit = `${f(x0 - pad)} ${f(y0 - pad)} ${f(x1 - x0 + 2 * pad)} ${f(y1 - y0 + 2 * pad)}`);
}

function drawSVG(instant) {
  if (S.balShown >= 0) return; // 正在显示受力平衡图
  const v = V();
  const vb = v.vb || fitBox(v);
  $('#svgw').innerHTML = `<svg class="dg instant" viewBox="${vb}" xmlns="http://www.w3.org/2000/svg">${v.svg(S.params)}</svg>`;
  applyStep(true);
}

function applyStep(instant) {
  const svg = $('#svgw svg');
  if (!svg) return;
  if (instant) svg.classList.add('instant');
  const cur = S.cur;
  svg.querySelectorAll('[data-s]').forEach(e => { const s = +e.dataset.s, u = e.dataset.u != null ? +e.dataset.u : 1e9; e.classList.toggle('on', cur >= s && cur < u); });
  svg.querySelectorAll('[data-tk]').forEach(e => { e.style.transform = cur >= +e.dataset.tk ? e.dataset.tf : ''; });
  svg.querySelectorAll('[data-dk]').forEach(e => { const a = +e.dataset.dk, b = e.dataset.du != null ? +e.dataset.du : 1e9; e.classList.toggle('dim', cur >= a && cur < b); });
  svg.querySelectorAll('[data-hk]').forEach(e => { const L = String(e.dataset.hk).split(',').map(Number); e.classList.toggle('hot', L.includes(cur)); });
  if (instant) { svg.getBoundingClientRect(); requestAnimationFrame(() => requestAnimationFrame(() => svg.classList.remove('instant'))); }
}

function go(i, instant) {
  const n = allSteps(V()).length, nf = V().steps.length;
  i = Math.max(0, Math.min(n - 1, i));
  S.cur = i;
  const want = i >= nf ? i - nf : -1;
  if (want !== S.balShown) { S.balShown = want; if (want < 0) drawSVG(true); else drawBal(want); }
  else if (want < 0) applyStep(instant);
  document.querySelectorAll('#steps li').forEach(li => { const k = +li.dataset.i; li.classList.toggle('on', k === i); li.classList.toggle('later', k > i); });
  document.querySelectorAll('#dots i').forEach(d => d.classList.toggle('on', +d.dataset.i <= i));
  $('#stepno').textContent = `${i} / ${n - 1}`;
  $('#bPrev').disabled = i === 0;
  $('#bNext').disabled = i === n - 1;
  $('#shno').textContent = `第 ${i} 步 / 共 ${n - 1} 步`;
  $('#mprog').innerHTML = Array.from({ length: n }, (_, k) => `<i class="${k <= i ? 'on' : ''}"></i>`).join('');
  $('#mPrev').disabled = i === 0;
  $('#mNext').textContent = i === n - 1 ? (PROBS[PROBS.indexOf(S.p) + 1] ? '下一题' : '答案汇总') : '下一步';
  if (!instant) {
    const li = document.querySelector('#steps li.on');
    if (li) {
      const r = li.getBoundingClientRect(), mobile = window.innerWidth <= 960;
      const figB = mobile && getComputedStyle($('#fig')).position === 'sticky' ? $('#fig').getBoundingClientRect().bottom : 0;
      if (mobile && !$('#steps').classList.contains('all')) {
        // 手机上只显示当前步：新的一步从图下方开始读
        const figT = $('#fig').getBoundingClientRect().top, stickTop = parseFloat(getComputedStyle($('#fig')).top) || 0;
        if (figB && figT > stickTop + 2) window.scrollBy({ top: figT - stickTop, behavior: 'smooth' }); // 图还没到顶：先把图推到顶上固定
        else if (r.top < figB + 4) window.scrollBy({ top: r.top - figB - 10, behavior: 'smooth' });
      } else if (r.top < figB + 8 || r.bottom > window.innerHeight - 8) window.scrollBy({ top: r.top - figB - 16, behavior: 'smooth' });
    }
  }
}

function togglePlay() {
  if (S.timer) { stop(); return; }
  if (S.cur >= allSteps(V()).length - 1) go(0);
  $('#bPlay').textContent = '停止播放';
  S.timer = setInterval(() => { if (S.cur >= allSteps(V()).length - 1) { stop(); return; } go(S.cur + 1); }, 4200);
}
function stop() { if (S.timer) { clearInterval(S.timer); S.timer = null; } const b = $('#bPlay'); if (b) b.textContent = '自动播放'; }

function copyWrite() {
  const txt = (pick('write') || []).map(l => plainLine(typeof l === 'string' ? l : l[0])).join('\n');
  const done = () => { const b = $('#bCopy'); b.textContent = '已复制'; setTimeout(() => b.textContent = '复制文字', 1500); };
  const fallback = () => { const ta = document.createElement('textarea'); ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch (e) {} ta.remove(); };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).then(done, fallback); else fallback();
}

document.addEventListener('keydown', e => {
  if (!S.p || /INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
  if (e.key === 'ArrowRight') { stop(); go(S.cur + 1); }
  if (e.key === 'ArrowLeft') { stop(); go(S.cur - 1); }
});

/* ========== 第三、四章用到的图元和动画 ========== */
// 均布载荷：x1..x2，y 为梁上表面
D.q = (x1, x2, y, o = {}) => {
  const h = o.h || 46, n = Math.max(3, Math.round((x2 - x1) / 26));
  let s = `<line x1="${f(x1)}" y1="${f(y - h)}" x2="${f(x2)}" y2="${f(y - h)}"/>`;
  for (let i = 0; i <= n; i++) {
    const x = x1 + (x2 - x1) * i / n;
    s += `<line x1="${f(x)}" y1="${f(y - h)}" x2="${f(x)}" y2="${f(y - 9)}"/><path d="M${f(x)},${f(y - 2)} L${f(x - 3.5)},${f(y - 10)} L${f(x + 3.5)},${f(y - 10)} Z"/>`;
  }
  s += `<text x="${f((x1 + x2) / 2)}" y="${f(y - h - 8)}" class="lb" text-anchor="middle">${lab(o.l || 'q')}</text>`;
  return D.g(s, o, 'ql');
};
// 固定端（墙）
D.wall = (x, y1, y2, side, o = {}) => D.g(D.hatch(x, y1, x, y2, side) + `<line x1="${x}" y1="${y1}" x2="${x}" y2="${y2}" class="frm"/>`, o);
// 桁架杆
D.bar = (p, q, o = {}) => `<line x1="${f(p[0])}" y1="${f(p[1])}" x2="${f(q[0])}" y2="${f(q[1])}" class="bar${o.cls ? ' ' + o.cls : ''}"${at(o)}/>`;
// 沿直线方向旋转的文字
D.rtxt = (x, y, t, deg, cls = 'nt', o = {}) => `<text x="${f(x)}" y="${f(y)}" class="${cls}" text-anchor="${o.a || 'middle'}" transform="rotate(${-deg} ${f(x)} ${f(y)})"${at(o)}>${lab(t)}</text>`;
// 扇形色块（标角度用）
D.wedge = (cx, cy, r1, r2, a1, a2, o = {}) => {
  const [p1x, p1y] = pol(cx, cy, r1, a1), [p2x, p2y] = pol(cx, cy, r2, a1), [p3x, p3y] = pol(cx, cy, r2, a2), [p4x, p4y] = pol(cx, cy, r1, a2);
  return `<path d="M${f(p1x)},${f(p1y)} L${f(p2x)},${f(p2y)} A${r2},${r2} 0 0 0 ${f(p3x)},${f(p3y)} L${f(p4x)},${f(p4y)} A${r1},${r1} 0 0 1 ${f(p1x)},${f(p1y)} Z" class="wedge"${at(o)}/>`;
};

// 改参数（滑块、按钮共用）
function setParam(k, val) {
  const v = V(), pm = v.params[k];
  S.params[k] = val;
  const inp = $('#pr_' + k); if (inp) inp.value = val;
  const lb = $('#pv_' + k); if (lb) lb.textContent = pm.fmt(val);
  drawSVG(true); updReadout();
}
// 机构动画：按时间推进某个参数
const ANIM = { raf: 0, last: 0, dir: 1 };
function stopAnim() { if (ANIM.raf) cancelAnimationFrame(ANIM.raf); ANIM.raf = 0; const b = $('#bAnim'); if (b) b.textContent = '播放运动'; }
function startAnim() {
  const v = V(), A = v.anim, pm = v.params[A.k];
  stopAnim(); ANIM.last = 0; ANIM.dir = 1;
  const b = $('#bAnim'); if (b) b.textContent = '暂停运动';
  const tick = ts => {
    if (S.p == null || V() !== v) return stopAnim();
    if (ANIM.last) {
      let x = S.params[A.k] + ANIM.dir * A.speed * Math.min(0.05, (ts - ANIM.last) / 1000);
      if (x > pm.max) { if (A.mode === 'loop') x = pm.min + (x - pm.max); else { x = pm.max; ANIM.dir = -1; } }
      if (x < pm.min) { x = pm.min; ANIM.dir = 1; }
      setParam(A.k, x);
    }
    ANIM.last = ts; ANIM.raf = requestAnimationFrame(tick);
  };
  ANIM.raf = requestAnimationFrame(tick);
}
const animTool = () => ({ label: '播放运动', id: 'bAnim', on: () => ANIM.raf ? stopAnim() : startAnim() });
const jumpTool = (label, k, val) => ({ label, on: () => { stopAnim(); setParam(k, val); } });

function gearPath(cx, cy, R, z, ph) {
  const ad = 7, dd = 7, p = 360 / z; let d = '';
  for (let k = 0; k < z; k++) {
    const c = ph + k * p;
    [[R - dd, c - 0.5 * p], [R - dd, c - 0.27 * p], [R + ad, c - 0.15 * p], [R + ad, c + 0.15 * p], [R - dd, c + 0.27 * p]].forEach(([r, a], i) => {
      const [x, y] = pol(cx, cy, r, a); d += (k === 0 && i === 0 ? 'M' : 'L') + f(x) + ',' + f(y) + ' ';
    });
  }
  return d + 'Z';
}
function gearBody(cx, cy, R, z, ph) {
  let s = `<path d="${gearPath(cx, cy, R, z, ph)}" class="body"/>`;
  for (let k = 0; k < 5; k++) { const [x, y] = pol(cx, cy, R * 0.56, k * 72 + 18); s += `<circle cx="${f(x)}" cy="${f(y)}" r="${f(R * 0.15)}" class="hole"/>`; }
  return s + `<circle cx="${cx}" cy="${cy}" r="17" class="body"/>`;
}

// 桁架图：nodes 名→坐标，bars [编号, 端点1, 端点2, 编号偏移]，zero {编号: 第几步变零}
function trussSvg(c) {
  let s = '';
  s += c.supports || '';
  c.bars.forEach(([no, p, q, off]) => {
    const P = c.nodes[p], Q = c.nodes[q], k = c.zero[no];
    s += D.bar(P, Q, k != null ? { u: k } : {});
    if (k != null) s += D.bar(P, Q, { cls: 'zero', s: k });
    if (no) {
      const mx = (P[0] + Q[0]) / 2 + (off ? off[0] : 0), my = (P[1] + Q[1]) / 2 + (off ? off[1] : 0);
      s += `<text x="${f(mx)}" y="${f(my + 5)}" class="mn" text-anchor="middle">${no}</text>`;
      if (k != null) s += `<text x="${f(mx)}" y="${f(my + 24)}" class="zl" text-anchor="middle"${at({ s: k })}>零杆</text>`;
    }
  });
  Object.values(c.nodes).forEach(P => s += D.pin(P[0], P[1], { r: 4.5 }));
  (c.focus || []).forEach(([n, k]) => { const P = c.nodes[n]; s += `<circle cx="${P[0]}" cy="${P[1]}" r="17" class="focus"${at({ s: k, u: k + 1 })}/>`; });
  s += c.loads || '';
  s += c.labels || '';
  return s;
}

  (c.F || []).forEach(x => s += D.ai(x, BY - 6, 64, 270, { g: 0, l: 'F', lp: [x + 15, BY - 52] }));
  (c.M || []).forEach(m => s += D.couple(m.x, BY, 22, m.cw, 'M', { lp: [m.x + (m.dx || 0), BY - 36] }));
  (c.lab || []).forEach(L => s += D.txt(L[0], L[1], L[2]));

const CA = 110, cx = n => 100 + CA * n; // a = 110 px
function comboSvg(c) {
  let L = '', R = '';
  const dimsY = 340;
  let s = [0, 1, 2, 3].map(i => D.dim(cx(i), dimsY, cx(i + 1), dimsY, 'a', { off: 18 })).join('');
  // 左段 AC
  (c.qL || []).forEach(q => L += D.q(q[0], q[1], BY - 6, { l: 'q' }));
  L += D.rod([[cx(0), BY], [cx(2), BY]]);
  L += c.supL || '';
  L += c.loadL || '';
  L += D.pin(cx(2), BY);
  L += D.txt(cx(0) + 12, BY - 18, 'A') + D.txt(cx(1) + 22, BY + 22, 'B') + D.txt(cx(2) - 4, BY - 18, 'C');
  L += c.fbdL || '';
  // 右段 CD（第 1 步起往右挪开）
  (c.qR || []).forEach(q => R += D.q(q[0], q[1], BY - 6, { l: 'q' }));
  R += D.rod([[cx(2), BY], [cx(4), BY]]);
  R += D.roller(cx(4), BY, 0, { dk: 1 });
  R += c.loadR || '';
  R += D.pin(cx(2), BY);
  R += D.txt(cx(4) + 18, BY - 16, 'D');
  R += c.fbdR || '';
  s += L + `<g data-tk="1" data-tf="translate(30px,0px)">${R}</g>` + `<rect x="${cx(4) + 70}" y="${BY}" width="1" height="1" fill="none"/>`;
  return s;
}

function allSteps(v) {
  if (!v._all) v._all = v.steps.concat(v.bal.map(g => ['受力平衡图：' + g.t, balText(g)]));
  return v._all;
}
function balText(g) {
  const names = g.F.map(x => `$${x[0]}$`).join('、');
  let t = `把${g.t}受的 ${g.F.length} 个力（${names}）都平移到同一点，就是图里左半边。右半边把它们一个接一个首尾相连，最后一支箭头的尖正好回到起点，说明合力为零：$ΣF_x=0$，$ΣF_y=0$。`;
  t += g.con ? '<br>这几个力本来就交于一点，合力为零就是它平衡的全部条件。' : '<div class="tip"><b>还差一半</b>　这些力在原图里不交于一点，合力为零只说明它不会移动；不转动靠的是力矩平衡，就是前面的取矩方程。</div>';
  if (g.note) t += `<p>${g.note}</p>`;
  return t;
}
function drawBal(k) {
  const g = V().bal[k];
  const F = g.F.map(([l, m, d, c, v]) => ({ l, m, d, c, v, ux: Math.cos(d * RAD), uy: Math.sin(d * RAD) }));
  const maxM = Math.max(...F.map(x => x.m)), k1 = 112 / maxM, C = [165, 250], CY = 250;
  // 文字防重叠：按给定方向一点点挪开
  const placed = [[0, 0, 640, 70]];
  const tw = x => x.l.replace(/[_{}]/g, '').length * 10 + (x.v ? x.v.length * 7.5 + 6 : 0);
  const place = (cx, cy, w, dx, dy) => {
    for (let t = 0; t < 10; t++) {
      const b = [cx - w / 2, cy - 15, cx + w / 2, cy + 5];
      if (!placed.some(q => b[0] < q[2] && b[2] > q[0] && b[1] < q[3] && b[3] > q[1])) { placed.push(b); return [cx, cy]; }
      cx += dx * 12; cy += dy * 12;
    }
    placed.push([cx - w / 2, cy - 15, cx + w / 2, cy + 5]); return [cx, cy];
  };
  let s = `<text x="20" y="34" class="bt">受力平衡图 · ${g.t}</text><text x="620" y="34" class="replay" text-anchor="end">重播</text>`;
  s += `<text x="165" y="62" class="nt" text-anchor="middle">① 平移到同一点</text><text x="480" y="62" class="nt" text-anchor="middle">② 首尾相接</text>`;
  s += `<line x1="322" y1="78" x2="322" y2="425" class="dm"/>`;
  // ① 汇交图：各力从外面飞到同一点；同方向的力并排错开 12 像素，标签往外错开
  const lbl = (x, X, Y) => `<text x="${f(X)}" y="${f(Y)}" class="lb" text-anchor="middle">${lab(x.l)}<tspan class="bv" dx="5">${x.v}</tspan></text>`;
  const grp = {};
  F.forEach(x => { const key = Math.round(((x.d % 360) + 360) % 360); (grp[key] = grp[key] || []).push(x); });
  F.forEach((x, i) => {
    const same = grp[Math.round(((x.d % 360) + 360) % 360)], j = same.indexOf(x), n = same.length;
    const len = Math.max(x.m * k1, 14), off = (j - (n - 1) / 2) * 12;
    const ox0 = C[0] - x.uy * off, oy0 = C[1] - x.ux * off;
    const [lx0, ly0] = pol(ox0, oy0, len + 24, x.d), fly = pol(0, 0, 90, x.d);
    const [lx, ly] = place(lx0, ly0 + 6, tw(x), x.ux, -x.uy);
    s += `<g class="fly" style="--fx:${f(fly[0])}px;--fy:${f(fly[1])}px;transition-delay:${(i * 0.18).toFixed(2)}s"><g class="arw ${x.c}">` + D.af(ox0, oy0, len, x.d, { c: x.c }).replace(/^<g class="arw [a-z]+"[^>]*>/, '').replace(/<\/g>$/, '') + lbl(x, lx, ly) + '</g></g>';
  });
  s += `<circle cx="${C[0]}" cy="${C[1]}" r="4" class="kdot"/>`;
  // ② 力多边形：反向的力错开 14 像素画，方便看清
  let px = 0, py = 0, shx = 0, shy = 0, sx = 0, sy = 0;
  const seg = F.map((x, i) => {
    const prev = F[i - 1];
    if (prev && Math.abs(prev.ux * x.uy - prev.uy * x.ux) < 0.04 && prev.ux * x.ux + prev.uy * x.uy < 0) { shx += -x.uy * 16; shy += x.ux * 16; }
    const len = x.m * k1, t = [px + shx, py + shy];
    px += len * x.ux; py += len * x.uy; sx += x.m * x.ux; sy += x.m * x.uy;
    return { x, t, h: [px + shx, py + shy] };
  });
  const closed = Math.hypot(sx, sy) < 0.02 * maxM;
  const xs = [0, ...seg.flatMap(q => [q.t[0], q.h[0]])], ys = [0, ...seg.flatMap(q => [q.t[1], q.h[1]])];
  const bx0 = Math.min(...xs), bx1 = Math.max(...xs), by0 = Math.min(...ys), by1 = Math.max(...ys);
  const sc = Math.min(1, 250 / Math.max(bx1 - bx0, 1), 250 / Math.max(by1 - by0, 1));
  const P = ([x, y]) => [480 + (x - (bx0 + bx1) / 2) * sc, CY - (y - (by0 + by1) / 2) * sc];
  seg.forEach((q, i) => {
    const [tx, ty] = P(q.t), [hx, hy] = P(q.h), L = Math.hypot(hx - tx, hy - ty);
    const tt = i % 2 ? 0.62 : 0.4, [mx, my] = place(tx + (hx - tx) * tt - q.x.uy * 18, ty + (hy - ty) * tt - q.x.ux * 18 + 5, q.x.l.replace(/[_{}]/g, '').length * 10, -q.x.uy, -q.x.ux);
    s += `<g class="fly" style="--fx:${f(C[0] - tx)}px;--fy:${f(C[1] - ty)}px;transition-delay:${(0.9 + i * 0.45).toFixed(2)}s">` + D.arrow(tx, ty, hx, hy, { c: q.x.c, h: Math.min(14, L * 0.6), w: Math.min(5.5, L * 0.25), l: q.x.l, lp: [mx, my] }) + '</g>';
  });
  const [ox, oy] = P([0, 0]), last = P(seg[seg.length - 1].h), T = (0.9 + seg.length * 0.45 + 0.3).toFixed(2);
  s += `<circle cx="${f(ox)}" cy="${f(oy)}" r="4.5" class="kdot"/>`;
  if (closed) {
    s += `<g class="late" style="transition-delay:${T}s"><circle cx="${f(ox)}" cy="${f(oy)}" r="12" class="focus"/>`;
    if (Math.hypot(last[0] - ox, last[1] - oy) > 3) s += `<line x1="${f(last[0])}" y1="${f(last[1])}" x2="${f(ox)}" y2="${f(oy)}" class="dsh"/>`;
    s += `<text x="480" y="446" class="big" text-anchor="middle">回到起点（圆点）⇒ ΣF<tspan dy="4" font-size="12">x</tspan><tspan dy="-4"> = 0，ΣF</tspan><tspan dy="4" font-size="12">y</tspan><tspan dy="-4"> = 0</tspan></text></g>`;
  }
  s += `<text x="165" y="446" class="nt" text-anchor="middle">${g.con ? '各力交于一点：合力为零就平衡' : '各力不交于一点：还要看力矩'}</text>`;
  $('#svgw').innerHTML = `<svg class="dg balp pre" viewBox="0 0 640 460" xmlns="http://www.w3.org/2000/svg">${s}</svg>`;
  const svg = $('#svgw svg');
  svg.querySelector('.replay').onclick = () => drawBal(k);
  svg.getBoundingClientRect();
  requestAnimationFrame(() => requestAnimationFrame(() => svg.classList.remove('pre')));
}

function drawProj(a) {

  let s = D.arrow(ox - 14, oy, 380, oy, { c: 'ax', h: 10, w: 4, l: 'x', lp: [390, oy + 5] }) + D.arrow(ox, oy + 14, ox, 14, { c: 'ax', h: 10, w: 4, l: 'y', lp: [ox + 14, 20] });
  s += D.ln(tx, ty, tx, oy, 'dsh') + D.ln(tx, ty, ox, ty, 'dsh');
  if (L * c > 18) s += D.arrow(ox, oy, tx, oy, { c: 'g', dash: 1, l: 'F_x', lp: [(ox + tx) / 2, oy + 24] });
  if (L * sn > 18) s += D.arrow(ox, oy, ox, ty, { c: 'g', dash: 1, l: 'F_y', lp: [ox - 22, (oy + ty) / 2 + 5] });
  s += D.arrow(ox, oy, tx, ty, { l: 'F', lp: [tx + 14, ty - 4] });
  if (a > 3) s += D.arc(ox, oy, 42, 0, a, 'α', { lo: 13 });
  return s;
}

  $('#nav').innerHTML = `<a href="#intro" data-id="intro"><span class="no">0</span><span class="t">先看这页</span></a>` +
    CHAPTERS.map((c, ci) => `<h4>${c.no} ${c.name}</h4><a href="#${c.id}" data-id="${c.id}" class="chl"><span class="no">${c.short}</span><span class="t">本章要点</span></a>${probsOf(ci).map(item).join('')}`).join('') +
    `<h4>最后</h4><a href="#sum" data-id="sum"><span class="no">✓</span><span class="t">答案汇总</span></a>`;
}
function route() {
  stop();
  stopAnim();
  const id = (location.hash || '#intro').slice(1);
  document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('on', a.dataset.id === id));
  const p = PROBS.find(x => x.id === id);
  S.p = null;
  if (p) { S.p = p; S.vi = 0; S.cur = 0; renderProb(p); document.title = `${p.nav} ${p.short} · 工程力学作业讲解`; }
  else if (id === 'sum') { $('#main').innerHTML = sumHTML(); document.title = '答案汇总 · 工程力学作业讲解'; }
  else if (CHAPTERS.some(c => c.id === id)) { const ci = CHAPTERS.findIndex(c => c.id === id); $('#main').innerHTML = chapterHTML(ci); document.title = `${CHAPTERS[ci].no} ${CHAPTERS[ci].name} · 工程力学作业讲解`; }
  else { $('#main').innerHTML = T(introHTML()); initIntro(); document.title = '工程力学作业讲解'; }
  window.scrollTo(0, 0);
  const on = document.querySelector('#nav a.on');
  if (on && window.innerWidth <= 960) on.scrollIntoView({ block: 'nearest', inline: 'center' });
}
function initTheme() {
  const b = $('#theme'), modes = ['auto', 'dark', 'light'], names = { auto: '跟随系统', dark: '深色', light: '浅色' };
  let m = 'auto';
  try { m = localStorage.getItem('em-theme') || 'auto'; } catch (e) {}
  const apply = () => { if (m === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', m); b.textContent = '主题：' + names[m]; };
  b.onclick = () => { m = modes[(modes.indexOf(m) + 1) % 3]; try { localStorage.setItem('em-theme', m); } catch (e) {} apply(); };
  apply();
}
buildNav();
initTheme();
window.addEventListener('hashchange', route);
route();

</script>
</body>
